name: 🟩 Daily Green Contribution

on:
  schedule:
    - cron: '0 12 * * *'   # Every day at 12:00 UTC
  workflow_dispatch:         # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  commit:
    name: Daily Commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config --global user.email "danielbalogunofficial@gmail.com"
          git config --global user.name "Techflame-dev"

      - name: Make daily commit
        run: |
          echo "Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > log.txt
          echo "Streak day: ${{ github.run_number }}" >> log.txt
          git add log.txt
          git commit -m "🟩 daily contribution — $(date -u '+%Y-%m-%d')"
          git push
